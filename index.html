<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DevType | Syntax Speedtyper</title>
    <meta
      name="description"
      content="A focused typing practice for developers. Build fluency with code, keywords, developer vocabulary, and symbols."
    />
    <meta name="theme-color" content="#242522" />
    <script>
      try {
        const saved = JSON.parse(localStorage.getItem('devtype.preferences.v1'));
        const mode =
          saved?.version === 1 ? saved.colorMode : localStorage.getItem('devtype_color_mode');
        document.documentElement.dataset.theme = mode === 'light' ? 'light' : 'dark';
        const accents = ['amber', 'mint', 'blue', 'violet', 'mono'];
        document.documentElement.dataset.accent = accents.includes(saved?.themeId)
          ? saved.themeId
          : 'amber';
      } catch {}
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=JetBrains+Mono:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
